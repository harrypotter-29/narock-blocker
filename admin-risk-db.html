<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Risk DB · NAROCK BLOCKER Admin</title><link rel="stylesheet" href="assets/css/style.css"></head><body><main class="admin-page"><div class="admin-layout"><section class="admin-main"><div class="admin-top"><div><div class="eyebrow">CONTENT INTELLIGENCE</div><h1 style="font-size:40px;letter-spacing:-.05em;margin:7px 0">위험 표현 DB</h1><p class="muted">표현·변형어·카테고리·대체 표현을 관리합니다.</p></div><button class="btn purple small" id="addTermBtn">+ 새 표현</button></div>

-engine.js"></script><script src="assets/js/app-store.js"></script><script src="assets/js/admin-common.js"></script><script src="assets/js/admin-risk-db.js"></script></body></html>
