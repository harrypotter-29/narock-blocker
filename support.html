<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문의 · NAROCK BLOCKER</title><link rel="stylesheet" href="assets/css/style.css"></head><body>
<main class="page"><section class="section"><div class="wrap public-form-wrap"><div class="reveal"><div class="eyebrow">SUPPORT</div><h1 class="display" style="font-size:clamp(48px,5vw,76px)">사용 중 궁금한 점을<br><span class="purple">문의해주세요.</span></h1><p class="body-lg">제품 사용, 결과 해석, 데이터 처리 방식과 관련된 문의를 남길 수 있습니다.</p></div><form class="form-card reveal" id="supportForm"><div class="form-grid"><div><label>이름</label><input name="name" required></div><div><label>이메일</label><input name="email" type="email" required></div><div class="full"><label>문의 유형</label><select name="type"><option value="support">서비스 사용</option><option value="product">제품 기능</option><option value="privacy">개인정보 / 데이터</option><option value="other">기타</option></select></div><div class="full"><label>제목</label><input name="subject" required></div><div class="full"><label>문의 내용</label><textarea name="message" required></textarea></div></div><button class="btn purple" type="submit" style="width:100%;margin-top:14px">문의 보내기 →</button></form></div></section></main>
<footer class="footer"><div class="wrap"><span>NAROCK BLOCKER</span><span>Support Prototype</span></div></footer>
<script src="assets/js/common.js"></script><script src="assets/js/app-store.js"></script><script>
const f=document.getElementById('supportForm');f.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(f);AppStore.add('inquiries',{name:d.get('name'),email:d.get('email'),type:d.get('type'),subject:d.get('subject'),message:d.get('message'),status:'new'});f.reset();let t=document.createElement('div');t.className='toast show';t.textContent='문의를 접수했습니다. 관리자 문의 관리에 반영됩니다.';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)});
</script></body></html>
